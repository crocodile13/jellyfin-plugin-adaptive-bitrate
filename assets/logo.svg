<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Adaptive Bitrate</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2342"/>
      <stop offset="1" stop-color="#0f1324"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00a4dc"/>
      <stop offset="1" stop-color="#aa5cc3"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <!-- échelle de qualités : cinq marches -->
  <g fill="url(#bar)">
    <rect x="92" y="318" width="52" height="102" rx="12" opacity="0.55"/>
    <rect x="160" y="270" width="52" height="150" rx="12" opacity="0.65"/>
    <rect x="228" y="214" width="52" height="206" rx="12" opacity="0.75"/>
    <rect x="296" y="156" width="52" height="264" rx="12" opacity="0.88"/>
    <rect x="364" y="92" width="52" height="328" rx="12"/>
  </g>
  <!-- débit qui suit le réseau : courbe continue, sans coupure -->
  <path d="M 84 214 C 150 214, 168 330, 236 300 S 326 150, 430 128" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="430" cy="128" r="20" fill="#ffffff"/>
</svg>
